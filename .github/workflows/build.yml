name: Build and test

on:
  push:
    branches: ["neoforge"]
  pull_request:
    branches: ["neoforge"]

permissions:
  contents: read

jobs:
  build:
    uses: bertie-mc/bertie-ci/.github/workflows/build-mod.yml@v3.6.0

  client:
    needs: build
    uses: bertie-mc/bertie-ci/.github/workflows/client.yml@v3.6.0
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
